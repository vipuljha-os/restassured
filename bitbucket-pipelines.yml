pipelines:
  branches:
    master:
      - step:
          name: Build, Echo Test Script Paths, Run Tests, Rerun Failed Tests, and Send Results to Google Chat
          image: maven:3.8.5-openjdk-17
          caches:
            - maven
          script:
            - apt-get update && apt-get install -y curl
            - set +e
            # Echo the path of the test scripts
            - echo "Test scripts path:"
            - find $(pwd) -name "*.java" # This will list all Java test files
            # Run tests using release.xml and rerun failing tests once
            - mvn clean test

            # Extract test results
            - |
              TEST_RESULTS=$(grep -o '<testsuite .*' target/surefire-reports/*.xml | head -1)
              TESTS=$(echo $TEST_RESULTS | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*')
              FAILURES=$(echo $TEST_RESULTS | grep -o 'failures="[0-9]*"' | grep -o '[0-9]*')
              ERRORS=$(echo $TEST_RESULTS | grep -o 'errors="[0-9]*"' | grep -o '[0-9]*')
              SKIPPED=$(echo $TEST_RESULTS | grep -o 'skipped="[0-9]*"' | grep -o '[0-9]*')

              # Extract failed test names
              FAILED_TESTS=$(awk -F'"' '/<testcase /{name=$2} /<(failure|error)/{print name}' target/surefire-reports/*.xml)
              if [ -z "$FAILED_TESTS" ]; then
                FAILED_TESTS="None"
              fi

              # Format the message for Google Chat
              MESSAGE="🚀 *API Test Suite Completed for Major Clients* 🚀\n
              🧪 *Total Tests:* $TESTS\n
              ❌ *Failures:* $FAILURES\n
              ⚠️ *Errors:* $ERRORS\n
              ⏭️ *Skipped:* $SKIPPED\n
              🔴 *Failed Tests:* $FAILED_TESTS"
              curl -X POST -H 'Content-Type: application/json' -d "{\"text\": \"${MESSAGE}\"}" "https://chat.googleapis.com/v1/spaces/AAAAR5VDOco/messages?key=$GOOGLE_CHAT_KEY&token=$GOOGLE_CHAT_TOKEN"
            - set -e
