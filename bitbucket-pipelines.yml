pipelines:
  branches:
    master:
      - step:
          name: Build, Test, Rerun Failed Tests, and Send Results to Google Chat
          image: maven:3.8.5-openjdk-17
          caches:
            - maven
          script:
            - apt-get update && apt-get install -y curl
            - set +e
            # Run tests and rerun failing tests once
            - mvn clean test -Dsurefire.rerunFailingTestsCount=1
            - |
              TEST_RESULTS=$(grep -o '<testsuite .*' target/surefire-reports/*.xml | head -1)
              TESTS=$(echo $TEST_RESULTS | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*')
              FAILURES=$(echo $TEST_RESULTS | grep -o 'failures="[0-9]*"' | grep -o '[0-9]*')
              ERRORS=$(echo $TEST_RESULTS | grep -o 'errors="[0-9]*"' | grep -o '[0-9]*')
              SKIPPED=$(echo $TEST_RESULTS | grep -o 'skipped="[0-9]*"' | grep -o '[0-9]*')

              # Extract the names of the failed test cases, limiting to the first 5
              FAILED_TESTS=$(awk -F'"' '/<testcase /{name=$2} /<(failure|error)/{print name}' target/surefire-reports/*.xml | head -5)

              # Ensure FAILED_TESTS is properly formatted
              if [ -z "$FAILED_TESTS" ]; then
                FAILED_TESTS="None"
              else
                FAILED_TESTS=$(echo "$FAILED_TESTS" | awk '{print "- " $0}' | tr '\n' '\\n')
              fi

              # Format the message using Google Chat Card (Attachment)
              MESSAGE="{
                \"cards\": [{
                  \"header\": {
                    \"title\": \"🚀 API Test Suite Completed for Major Clients 🚀\",
                    \"subtitle\": \"Test Results Summary\",
                    \"imageUrl\": \"https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Google_Chat_icon_%282020%29.svg/1200px-Google_Chat_icon_%282020%29.svg.png\",
                    \"imageStyle\": \"AVATAR\"
                  },
                  \"sections\": [
                    {
                      \"widgets\": [
                        { \"keyValue\": { \"topLabel\": \"🧪 Total Tests\", \"content\": \"$TESTS\" } },
                        { \"keyValue\": { \"topLabel\": \"❌ Failures\", \"content\": \"$FAILURES\", \"contentMultiline\": true } },
                        { \"keyValue\": { \"topLabel\": \"⚠️ Errors\", \"content\": \"$ERRORS\" } },
                        { \"keyValue\": { \"topLabel\": \"⏭️ Skipped\", \"content\": \"$SKIPPED\" } }
                      ]
                    },
                    {
                      \"header\": \"🔴 Failed Tests\",
                      \"widgets\": [
                        { \"textParagraph\": { \"text\": \"$FAILED_TESTS\" } }
                      ]
                    }
                  ]
                }]
              }"

              # Send the message to Google Chat
              curl -X POST -H 'Content-Type: application/json' -d "$MESSAGE" "https://chat.googleapis.com/v1/spaces/AAAAR5VDOco/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=-fk6nsvjYX6G8MtGvvuUS0Jwqeuc7448dFweg27eUZk"
            - set -e
